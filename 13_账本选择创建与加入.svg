<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="1000" viewBox="0 0 1440 1000"><rect width="1440" height="1000" fill="#F4F6F8"/><rect x="0" y="0" width="510" height="1000" rx="0" fill="#153E39"/><text x="65" y="139" font-family="Microsoft YaHei, sans-serif" font-size="44" font-weight="700" fill="white">共账</text><text x="65" y="199" font-family="Microsoft YaHei, sans-serif" font-size="25" font-weight="400" fill="#C2D8D0">把共同生活，记清楚。</text><text x="65" y="269" font-family="Microsoft YaHei, sans-serif" font-size="18" font-weight="400" fill="white">一个账本，多人协作</text><text x="65" y="312" font-family="Microsoft YaHei, sans-serif" font-size="16" font-weight="400" fill="#C2D8D0">收支审核 / 预算提醒 / 月度结算</text><rect x="65" y="602" width="376" height="225" rx="18" fill="#23534B"/><text x="92" y="652" font-family="Microsoft YaHei, sans-serif" font-size="21" font-weight="700" fill="white">清楚的记录，安心的分担</text><text x="92" y="705" font-family="Microsoft YaHei, sans-serif" font-size="16" font-weight="400" fill="#C2D8D0">历史保留，可查可追溯。</text><text x="92" y="748" font-family="Microsoft YaHei, sans-serif" font-size="16" font-weight="400" fill="#C2D8D0">加入后按你的账本角色操作。</text><text x="620" y="149" font-family="Microsoft YaHei, sans-serif" font-size="32" font-weight="700" fill="#172E38">我的账本</text><text x="620" y="188" font-family="Microsoft YaHei, sans-serif" font-size="16" font-weight="400" fill="#71818B">选择已有账本，或创建、加入新的共享账本</text><rect x="620" y="236" width="710" height="178" rx="16" fill="white"/><text x="648" y="288" font-family="Microsoft YaHei, sans-serif" font-size="24" font-weight="700" fill="#172E38">呢喃小屋</text><rect x="1190" y="264" width="110" height="28" rx="6" fill="#E8F5EF"/><text x="1200" y="282" font-family="Microsoft YaHei, sans-serif" font-size="13" font-weight="400" fill="#197B69">管理员</text><text x="648" y="332" font-family="Microsoft YaHei, sans-serif" font-size="15" font-weight="400" fill="#71818B">4 位成员  ·  最近更新 2026-10-31</text><rect x="1130" y="347" width="170" height="42" rx="8" fill="#197B69"/><text x="1146" y="372" font-family="Microsoft YaHei, sans-serif" font-size="15" font-weight="700" fill="white">进入账本</text><text x="620" y="473" font-family="Microsoft YaHei, sans-serif" font-size="14" font-weight="400" fill="#71818B">创建账本 · 名称</text><rect x="620" y="489" width="710" height="47" rx="7" fill="white" stroke="#E3E9ED"/><text x="634" y="517" font-family="Microsoft YaHei, sans-serif" font-size="15" font-weight="400" fill="#172E38">例如：寝室公共账本</text><rect x="620" y="555" width="190" height="42" rx="8" fill="#197B69"/><text x="636" y="580" font-family="Microsoft YaHei, sans-serif" font-size="15" font-weight="700" fill="white">创建账本</text><text x="620" y="674" font-family="Microsoft YaHei, sans-serif" font-size="14" font-weight="400" fill="#71818B">加入账本 · 邀请码</text><rect x="620" y="690" width="710" height="47" rx="7" fill="white" stroke="#E3E9ED"/><text x="634" y="718" font-family="Microsoft YaHei, sans-serif" font-size="15" font-weight="400" fill="#172E38">输入管理员提供的邀请码</text><rect x="620" y="757" width="220" height="42" rx="8" fill="#197B69"/><text x="636" y="782" font-family="Microsoft YaHei, sans-serif" font-size="15" font-weight="700" fill="white">检查邀请并加入</text><text x="620" y="852" font-family="Microsoft YaHei, sans-serif" font-size="14" font-weight="400" fill="#B84B4B">邀请失效：请联系管理员重新生成邀请。</text><text x="620" y="894" font-family="Microsoft YaHei, sans-serif" font-size="14" font-weight="400" fill="#71818B">重复加入：提示“已加入”，不创建重复成员关系。</text><text x="620" y="969" font-family="Microsoft YaHei, sans-serif" font-size="13" font-weight="400" fill="#71818B">已识别账号后的工作台；登录与注册方式仍待确认。</text></svg>