<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="1000" viewBox="0 0 1440 1000"><rect width="1440" height="1000" fill="#F4F6F8"/><rect x="0" y="0" width="232" height="1000" rx="0" fill="#153E39"/><text x="28" y="62" font-family="Microsoft YaHei, sans-serif" font-size="30" font-weight="700" fill="white">共账</text><text x="28" y="90" font-family="Microsoft YaHei, sans-serif" font-size="12" font-weight="400" fill="#94BBB0">SHARED LEDGER</text><rect x="18" y="127" width="196" height="74" rx="10" fill="#23534B"/><text x="32" y="160" font-family="Microsoft YaHei, sans-serif" font-size="18" font-weight="700" fill="white">呢喃小屋</text><text x="32" y="185" font-family="Microsoft YaHei, sans-serif" font-size="12" font-weight="400" fill="#BBD4CD">共享账本  /  2026</text><text x="37" y="254" font-family="Microsoft YaHei, sans-serif" font-size="16" font-weight="400" fill="#C2D8D0">账本概览</text><rect x="18" y="288" width="196" height="45" rx="8" fill="#E4F3ED"/><text x="37" y="313" font-family="Microsoft YaHei, sans-serif" font-size="16" font-weight="700" fill="#197B69">收支明细</text><text x="37" y="431" font-family="Microsoft YaHei, sans-serif" font-size="16" font-weight="400" fill="#C2D8D0">统计分析</text><text x="37" y="726" font-family="Microsoft YaHei, sans-serif" font-size="16" font-weight="400" fill="#C2D8D0">退出账本</text><text x="28" y="915" font-family="Microsoft YaHei, sans-serif" font-size="13" font-weight="400" fill="#9DC0B5">一起记录，清楚分担</text><text x="28" y="950" font-family="Microsoft YaHei, sans-serif" font-size="12" font-weight="400" fill="#9DC0B5">界面设计初稿  ·  示例数据</text><rect x="232" y="0" width="1208" height="82" rx="0" fill="white"/><text x="268" y="44" font-family="Microsoft YaHei, sans-serif" font-size="16" font-weight="400" fill="#71818B">工作台  /  新增收支</text><rect x="1195" y="25" width="110" height="28" rx="6" fill="#E8F5EF"/><text x="1205" y="43" font-family="Microsoft YaHei, sans-serif" font-size="13" font-weight="400" fill="#197B69">普通记账成员</text><text x="268" y="141" font-family="Microsoft YaHei, sans-serif" font-size="29" font-weight="700" fill="#172E38">新增收支</text><text x="268" y="172" font-family="Microsoft YaHei, sans-serif" font-size="14" font-weight="400" fill="#71818B">填写收支信息，提交后进入待审核；审核通过后计入有效统计</text><text x="268" y="977" font-family="Microsoft YaHei, sans-serif" font-size="12" font-weight="400" fill="#71818B">共账  /  多人共享记账系统</text><text x="1130" y="977" font-family="Microsoft YaHei, sans-serif" font-size="12" font-weight="400" fill="#71818B">所有金额及人员均为示例</text><rect x="268" y="206" width="735" height="710" rx="12" fill="white"/><rect x="294" y="231" width="100" height="28" rx="6" fill="#E8F5EF"/><text x="304" y="249" font-family="Microsoft YaHei, sans-serif" font-size="13" font-weight="400" fill="#197B69">支出</text><rect x="408" y="231" width="100" height="28" rx="6" fill="#FFF4DC"/><text x="418" y="249" font-family="Microsoft YaHei, sans-serif" font-size="13" font-weight="400" fill="#A66E17">收入</text><text x="294" y="304" font-family="Microsoft YaHei, sans-serif" font-size="14" font-weight="400" fill="#71818B">金额（元）</text><rect x="294" y="320" width="680" height="47" rx="7" fill="white" stroke="#E3E9ED"/><text x="308" y="348" font-family="Microsoft YaHei, sans-serif" font-size="15" font-weight="400" fill="#172E38">120.00</text><text x="294" y="389" font-family="Microsoft YaHei, sans-serif" font-size="13" font-weight="400" fill="#71818B">大于 0，最多两位小数，最高 1,000,000.00 元</text><text x="294" y="435" font-family="Microsoft YaHei, sans-serif" font-size="14" font-weight="400" fill="#71818B">分类</text><rect x="294" y="451" width="322" height="47" rx="7" fill="white" stroke="#E3E9ED"/><text x="308" y="479" font-family="Microsoft YaHei, sans-serif" font-size="15" font-weight="400" fill="#172E38">餐饮</text><text x="642" y="435" font-family="Microsoft YaHei, sans-serif" font-size="14" font-weight="400" fill="#71818B">发生日期</text><rect x="642" y="451" width="332" height="47" rx="7" fill="white" stroke="#E3E9ED"/><text x="656" y="479" font-family="Microsoft YaHei, sans-serif" font-size="15" font-weight="400" fill="#172E38">2026-10-28</text><text x="294" y="542" font-family="Microsoft YaHei, sans-serif" font-size="14" font-weight="400" fill="#71818B">实际付款人</text><rect x="294" y="558" width="322" height="47" rx="7" fill="white" stroke="#E3E9ED"/><text x="308" y="586" font-family="Microsoft YaHei, sans-serif" font-size="15" font-weight="400" fill="#172E38">小林</text><text x="642" y="542" font-family="Microsoft YaHei, sans-serif" font-size="14" font-weight="400" fill="#71818B">承担成员</text><rect x="642" y="558" width="332" height="47" rx="7" fill="white" stroke="#E3E9ED"/><text x="656" y="586" font-family="Microsoft YaHei, sans-serif" font-size="15" font-weight="400" fill="#172E38">小林 / 小周 / 小陈</text><text x="294" y="649" font-family="Microsoft YaHei, sans-serif" font-size="14" font-weight="400" fill="#71818B">备注</text><rect x="294" y="665" width="680" height="47" rx="7" fill="white" stroke="#E3E9ED"/><text x="308" y="693" font-family="Microsoft YaHei, sans-serif" font-size="15" font-weight="400" fill="#172E38">三人晚餐</text><text x="294" y="760" font-family="Microsoft YaHei, sans-serif" font-size="15" font-weight="400" fill="#172E38">承担金额   小林 ¥ 40.00     小周 ¥ 40.00     小陈 ¥ 40.00</text><rect x="294" y="827" width="170" height="42" rx="8" fill="#197B69"/><text x="310" y="852" font-family="Microsoft YaHei, sans-serif" font-size="15" font-weight="700" fill="white">提交审核</text><rect x="484" y="827" width="110" height="42" rx="8" fill="white" stroke="#E3E9ED"/><text x="500" y="852" font-family="Microsoft YaHei, sans-serif" font-size="15" font-weight="700" fill="#197B69">取消</text><rect x="1025" y="206" width="363" height="300" rx="12" fill="white"/><text x="1048" y="251" font-family="Microsoft YaHei, sans-serif" font-size="20" font-weight="700" fill="#172E38">录入检查</text><text x="1048" y="307" font-family="Microsoft YaHei, sans-serif" font-size="15" font-weight="400" fill="#172E38">• 金额与小数位合法</text><text x="1048" y="350" font-family="Microsoft YaHei, sans-serif" font-size="15" font-weight="400" fill="#172E38">• 承担合计等于总额</text><text x="1048" y="393" font-family="Microsoft YaHei, sans-serif" font-size="15" font-weight="400" fill="#172E38">• 当前成员具有记账权限</text><text x="1048" y="436" font-family="Microsoft YaHei, sans-serif" font-size="15" font-weight="400" fill="#172E38">• 避免重复点击提交</text><rect x="1025" y="531" width="363" height="186" rx="12" fill="#FFF4DC"/><text x="1048" y="571" font-family="Microsoft YaHei, sans-serif" font-size="18" font-weight="700" fill="#A66E17">需要修正时</text><text x="1048" y="612" font-family="Microsoft YaHei, sans-serif" font-size="14" font-weight="400" fill="#172E38">例如输入 1.001 元：</text><text x="1048" y="644" font-family="Microsoft YaHei, sans-serif" font-size="14" font-weight="400" fill="#B84B4B">“金额最多保留两位小数”</text><text x="1048" y="680" font-family="Microsoft YaHei, sans-serif" font-size="13" font-weight="400" fill="#71818B">错误字段保留输入，修正后再提交。</text></svg>