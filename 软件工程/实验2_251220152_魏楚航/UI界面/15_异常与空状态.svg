<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="1000" viewBox="0 0 1440 1000"><rect width="1440" height="1000" fill="#F1F3F4"/><text x="40" y="55" font-family="Microsoft YaHei, sans-serif" font-size="30" font-weight="700" fill="#171B1E">异常与空状态</text><text x="40" y="90" font-family="Microsoft YaHei, sans-serif" font-size="15" font-weight="400" fill="#68747B">提示问题及下一步操作，保留用户已输入的信息</text><rect x="40" y="130" width="655" height="390" rx="12" fill="white"/><rect x="68" y="158" width="115" height="28" rx="6" fill="#FFF4DC"/><text x="125.5" y="172.0" text-anchor="middle" dominant-baseline="central" font-family="Microsoft YaHei, sans-serif" font-size="13" font-weight="400" fill="#A66E17">操作提示</text><text x="68" y="261" font-family="Microsoft YaHei, sans-serif" font-size="25" font-weight="700" fill="#171B1E">没有符合条件的收支</text><text x="68" y="320" font-family="Microsoft YaHei, sans-serif" font-size="15" font-weight="400" fill="#68747B">尝试修改日期范围、状态或关键词。</text><rect x="68" y="411" width="200" height="42" rx="5" fill="#00D2BE"/><text x="168.0" y="432.0" text-anchor="middle" dominant-baseline="central" font-family="Microsoft YaHei, sans-serif" font-size="15" font-weight="700" fill="#171B1E">重置筛选</text><rect x="745" y="130" width="655" height="390" rx="12" fill="white"/><rect x="773" y="158" width="115" height="28" rx="6" fill="#FFF4DC"/><text x="830.5" y="172.0" text-anchor="middle" dominant-baseline="central" font-family="Microsoft YaHei, sans-serif" font-size="13" font-weight="400" fill="#A66E17">操作提示</text><text x="773" y="261" font-family="Microsoft YaHei, sans-serif" font-size="25" font-weight="700" fill="#171B1E">状态已变更，请刷新</text><text x="773" y="320" font-family="Microsoft YaHei, sans-serif" font-size="15" font-weight="400" fill="#68747B">另一位管理员已处理，本次操作未覆盖原结果。</text><rect x="773" y="411" width="200" height="42" rx="5" fill="#00D2BE"/><text x="873.0" y="432.0" text-anchor="middle" dominant-baseline="central" font-family="Microsoft YaHei, sans-serif" font-size="15" font-weight="700" fill="#171B1E">刷新记录</text><rect x="40" y="570" width="655" height="390" rx="12" fill="white"/><rect x="68" y="598" width="115" height="28" rx="6" fill="#FFF4DC"/><text x="125.5" y="612.0" text-anchor="middle" dominant-baseline="central" font-family="Microsoft YaHei, sans-serif" font-size="13" font-weight="400" fill="#A66E17">操作提示</text><text x="68" y="701" font-family="Microsoft YaHei, sans-serif" font-size="25" font-weight="700" fill="#171B1E">结算生成失败</text><text x="68" y="760" font-family="Microsoft YaHei, sans-serif" font-size="15" font-weight="400" fill="#68747B">本次未完成结算，请重试；已成功请求将返回原单。</text><rect x="68" y="851" width="200" height="42" rx="5" fill="#00D2BE"/><text x="168.0" y="872.0" text-anchor="middle" dominant-baseline="central" font-family="Microsoft YaHei, sans-serif" font-size="15" font-weight="700" fill="#171B1E">重试</text><rect x="745" y="570" width="655" height="390" rx="12" fill="white"/><rect x="773" y="598" width="115" height="28" rx="6" fill="#FFF4DC"/><text x="830.5" y="612.0" text-anchor="middle" dominant-baseline="central" font-family="Microsoft YaHei, sans-serif" font-size="13" font-weight="400" fill="#A66E17">操作提示</text><text x="773" y="701" font-family="Microsoft YaHei, sans-serif" font-size="25" font-weight="700" fill="#171B1E">当前无访问权限</text><text x="773" y="760" font-family="Microsoft YaHei, sans-serif" font-size="15" font-weight="400" fill="#68747B">你已退出账本或当前角色无法执行此操作。</text><rect x="773" y="851" width="200" height="42" rx="5" fill="#00D2BE"/><text x="873.0" y="872.0" text-anchor="middle" dominant-baseline="central" font-family="Microsoft YaHei, sans-serif" font-size="15" font-weight="700" fill="#171B1E">返回我的账本</text></svg>