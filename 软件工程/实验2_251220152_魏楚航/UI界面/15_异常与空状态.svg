<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="1000" viewBox="0 0 1440 1000"><rect width="1440" height="1000" fill="#F4F6F8"/><text x="40" y="55" font-family="Microsoft YaHei, sans-serif" font-size="30" font-weight="700" fill="#172E38">异常与空状态</text><text x="40" y="90" font-family="Microsoft YaHei, sans-serif" font-size="15" font-weight="400" fill="#71818B">提示问题及下一步操作，保留用户已输入的信息</text><rect x="40" y="130" width="655" height="390" rx="12" fill="white"/><rect x="68" y="158" width="115" height="28" rx="6" fill="#FFF4DC"/><text x="78" y="176" font-family="Microsoft YaHei, sans-serif" font-size="13" font-weight="400" fill="#A66E17">操作提示</text><text x="68" y="261" font-family="Microsoft YaHei, sans-serif" font-size="25" font-weight="700" fill="#172E38">没有符合条件的收支</text><text x="68" y="320" font-family="Microsoft YaHei, sans-serif" font-size="15" font-weight="400" fill="#71818B">尝试修改日期范围、状态或关键词。</text><rect x="68" y="411" width="200" height="42" rx="8" fill="#197B69"/><text x="84" y="436" font-family="Microsoft YaHei, sans-serif" font-size="15" font-weight="700" fill="white">重置筛选</text><rect x="745" y="130" width="655" height="390" rx="12" fill="white"/><rect x="773" y="158" width="115" height="28" rx="6" fill="#FFF4DC"/><text x="783" y="176" font-family="Microsoft YaHei, sans-serif" font-size="13" font-weight="400" fill="#A66E17">操作提示</text><text x="773" y="261" font-family="Microsoft YaHei, sans-serif" font-size="25" font-weight="700" fill="#172E38">状态已变更，请刷新</text><text x="773" y="320" font-family="Microsoft YaHei, sans-serif" font-size="15" font-weight="400" fill="#71818B">另一位管理员已处理，本次操作未覆盖原结果。</text><rect x="773" y="411" width="200" height="42" rx="8" fill="#197B69"/><text x="789" y="436" font-family="Microsoft YaHei, sans-serif" font-size="15" font-weight="700" fill="white">刷新记录</text><rect x="40" y="570" width="655" height="390" rx="12" fill="white"/><rect x="68" y="598" width="115" height="28" rx="6" fill="#FFF4DC"/><text x="78" y="616" font-family="Microsoft YaHei, sans-serif" font-size="13" font-weight="400" fill="#A66E17">操作提示</text><text x="68" y="701" font-family="Microsoft YaHei, sans-serif" font-size="25" font-weight="700" fill="#172E38">结算生成失败</text><text x="68" y="760" font-family="Microsoft YaHei, sans-serif" font-size="15" font-weight="400" fill="#71818B">本次未完成结算，请重试；已成功请求将返回原单。</text><rect x="68" y="851" width="200" height="42" rx="8" fill="#197B69"/><text x="84" y="876" font-family="Microsoft YaHei, sans-serif" font-size="15" font-weight="700" fill="white">重试</text><rect x="745" y="570" width="655" height="390" rx="12" fill="white"/><rect x="773" y="598" width="115" height="28" rx="6" fill="#FFF4DC"/><text x="783" y="616" font-family="Microsoft YaHei, sans-serif" font-size="13" font-weight="400" fill="#A66E17">操作提示</text><text x="773" y="701" font-family="Microsoft YaHei, sans-serif" font-size="25" font-weight="700" fill="#172E38">当前无访问权限</text><text x="773" y="760" font-family="Microsoft YaHei, sans-serif" font-size="15" font-weight="400" fill="#71818B">你已退出账本或当前角色无法执行此操作。</text><rect x="773" y="851" width="200" height="42" rx="8" fill="#197B69"/><text x="789" y="876" font-family="Microsoft YaHei, sans-serif" font-size="15" font-weight="700" fill="white">返回我的账本</text></svg>