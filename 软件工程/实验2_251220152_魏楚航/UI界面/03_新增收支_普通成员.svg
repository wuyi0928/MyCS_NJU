eight="400" fill="#95A9AF">界面设计初稿  ·  示例数据</text><rect x="232" y="0" width="1208" height="82" rx="0" fill="white"/><rect x="232" y="79" width="1208" height="3" rx="0" fill="#00D2BE"/><text x="268" y="44" font-family="Microsoft YaHei, sans-serif" font-size="16" font-weight="400" fill="#68747B">工作台  /  新增收支</text><rect x="1195" y="25" width="110" height="28" rx="6" fill="#E2F7F3"/><text x="1250.0" y="39.0" text-anchor="middle" dominant-baseline="central" font-family="Microsoft YaHei, sans-serif" font-size="13" font-weight="400" fill="#007E78">普通记账成员</text><text x="268" y="141" font-family="Microsoft YaHei, sans-serif" font-size="29" font-weight="700" fill="#171B1E">新增收支</text><text x="268" y="172" font-family="Microsoft YaHei, sans-serif" font-size="14" font-weight="400" fill="#68747B">填写收支信息，提交后进入待审核；审核通过后计入有效统计</text><text x="268" y="977" font-family="Microsoft YaHei, sans-serif" font-size="12" font-weight="400" fill="#68747B">共账  /  多人共享记账系统</text><text x="1130" y="977" font-family="Microsoft YaHei, sans-serif" font-size="12" font-weight="400" fill="#68747B">所有金额及人员均为示例</text><rect x="268" y="206" width="735" height="710" rx="12" fill="white"/><rect x="294" y="231" width="100" height="28" rx="6" fill="#E2F7F3"/><text x="344.0" y="245.0" text-anchor="middle" dominant-baseline="central" font-family="Microsoft YaHei, sans-serif" font-size="13" font-weight="400" fill="#007E78">支出</text><rect x="408" y="231" width="100" height="28" rx="6" fill="#FFF4DC"/><text x="458.0" y="245.0" text-anchor="middle" dominant-baseline="central" font-family="Microsoft YaHei, sans-serif" font-size="13" font-weight="400" fill="#A66E17">收入</text><text x="294" y="304" font-family="Microsoft YaHei, sans-serif" font-size="14" font-weight="400" fill="#68747B">金额（元）</text><rect x="294" y="320" width="680" height="47" rx="7" fill="white" stroke="#DDE3E6"/><text x="308" y="348" font-family="Microsoft YaHei, sans-serif" font-size="15" font-weight="400" fill="#171B1E">120.00</text><text x="294" y="389" font-family="Microsoft YaHei, sans-serif" font-size="13" font-weight="400" fill="#68747B">大于 0，最多两位小数，最高 1,000,000.00 元</text><text x="294" y="435" font-family="Microsoft YaHei, sans-serif" font-size="14" font-weight="400" fill="#68747B">分类</text><rect x="294" y="451" width="322" height="47" rx="7" fill="white" stroke="#DDE3E6"/><text x="308" y="479" font-family="Microsoft YaHei, sans-serif" font-size="15" font-weight="400" fill="#171B1E">餐饮</text><text x="642" y="435" font-family="Microsoft YaHei, sans-serif" font-size="14" font-weight="400" fill="#68747B">发生日期</text><rect x="642" y="451" width="332" height="47" rx="7" fill="white" stroke="#DDE3E6"/><text x="656" y="479" font-family="Microsoft YaHei, sans-serif" font-size="15" font-weight="400" fill="#171B1E">2026-10-28</text><text x="294" y="542" font-family="Microsoft YaHei, sans-serif" font-size="14" font-weight="400" fill="#68747B">实际付款人</text><rect x="294" y="558" width="322" height="47" rx="7" fill="white" stroke="#DDE3E6"/><text x="308" y="586" font-family="Microsoft YaHei, sans-serif" font-size="15" font-weight="400" fill="#171B1E">小林</text><text x="642" y="542" font-family="Microsoft YaHei, sans-serif" font-size="14" font-weight="400" fill="#68747B">承担 / 受益成员</text><rect x="642" y="558" width="332" height="47" rx="7" fill="white" stroke="#DDE3E6"/><text x="656" y="586" font-family="Microsoft YaHei, sans-serif" font-size="15" font-weight="400" fill="#171B1E">小林 / 小周 / 小陈</text><text x="294" y="649" font-family="Microsoft YaHei, sans-serif" font-size="14" font-weight="400" fill="#68747B">备注</text><rect x="294" y="665" width="680" height="47" rx="7" fill="white" stroke="#DDE3E6"/><text x="308" y="693" font-family="Microsoft YaHei, sans-serif" font-size="15" font-weight="400" fill="#171B1E">三人晚餐</text><rect x="294" y="733" width="120" height="28" rx="6" fill="#E2F7F3"/><text x="354.0" y="747.0" text-anchor="middle" dominant-baseline="central" font-family="Microsoft YaHei, sans-serif" font-size="13" font-weight="400" fill="#007E78">均摊</text><rect x="430" y="727" width="180" height="42" rx="5" fill="white" stroke="#DDE3E6"/><text x="520.0" y="748.0" text-anchor="middle" dominant-baseline="central" font-family="Microsoft YaHei, sans-serif" font-size="15" font-weight="700" fill="#007E78">手动指定金额</text><text x="294" y="800" font-family="Microsoft YaHei, sans-serif" font-size="15" font-weight="400" fill="#171B1E">分配金额   小林 ¥ 40.00     小周 ¥ 40.00     小陈 ¥ 40.00</text><rect x="294" y="827" width="170" height="42" rx="5" fill="#00D2BE"/><text x="379.0" y="848.0" text-anchor="middle" dominant-baseline="central" font-family="Microsoft YaHei, sans-serif" font-size="15" font-weight="700" fill="#171B1E">提交审核</text><rect x="484" y="827" width="110" height="42" rx="5" fill="white" stroke="#DDE3E6"/><text x="539.0" y="848.0" text-anchor="middle" dominant-baseline="central" font-family="Microsoft YaHei, sans-serif" font-size="15" font-weight="700" fill="#007E78">取消</text><rect x="1025" y="206" width="363" height="300" rx="12" fill="white"/><text x="1048" y="251" font-family="Microsoft YaHei, sans-serif" font-size="20" font-weight="700" fill="#171B1E">录入检查</text><text x="1048" y="307" font-family="Microsoft YaHei, sans-serif" font-size="15" font-weight="400" fill="#171B1E">• 金额与小数位合法</text><text x="1048" y="350" font-family="Microsoft YaHei, sans-serif" font-size="15" font-weight="400" fill="#171B1E">• 承担合计等于总额</text><text x="1048" y="393" font-family="Microsoft YaHei, sans-serif" font-size="15" font-weight="400" fill="#171B1E">• 当前成员具有记账权限</text><text x="1048" y="436" font-family="Microsoft YaHei, sans-serif" font-size="15" font-weight="400" fill="#171B1E">• 本人待审核 1 / 5 笔</text><rect x="1025" y="531" width="363" height="186" rx="12" fill="#FFF4DC"/><text x="1048" y="571" font-family="Microsoft YaHei, sans-serif" font-size="18" font-weight="700" fill="#A66E17">需要修正时</text><text x="1048" y="612" font-family="Microsoft YaHei, sans-serif" font-size="14" font-weight="400" fill="#171B1E">例如输入 1.001 元：</text><text x="1048" y="644" font-family="Microsoft YaHei, sans-serif" font-size="14" font-weight="400" fill="#B84B4B">“金额最多保留两位小数”</text><text x="1048" y="680" font-family="Microsoft YaHei, sans-serif" font-size="13" font-weight="400" fill="#68747B">错误字段保留输入，修正后再提交。</text><rect x="1025" y="741" width="363" height="175" rx="12" fill="#E2F7F3"/><text x="1048" y="780" font-family="Microsoft YaHei, sans-serif" font-size="18" font-weight="700" fill="#171B1E">分配说明</text><text x="1048" y="819" font-family="Microsoft YaHei, sans-serif" font-size="13" font-weight="400" fill="#68747B">收入与支出均可均分或手动指定。</text><text x="1048" y="854" font-family="Microsoft YaHei, sans-serif" font-size="13" font-weight="400" fill="#68747B">均摊余分随机分配，提交后固定。</text><text x="1048" y="889" font-family="Microsoft YaHei, sans-serif" font-size="13" font-weight="400" fill="#68747B">手动模式逐人填金额，合计须相等。</text></svg>