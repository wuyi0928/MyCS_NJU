<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="1000" viewBox="0 0 1440 1000"><rect width="1440" height="1000" fill="#F1F3F4"/><text x="40" y="55" font-family="Microsoft YaHei, sans-serif" font-size="30" font-weight="700" fill="#171B1E">关键操作确认与异常反馈</text><text x="40" y="90" font-family="Microsoft YaHei, sans-serif" font-size="15" font-weight="400" fill="#68747B">四个独立场景的界面组件，供主页面复用</text><rect x="40" y="130" width="655" height="390" rx="12" fill="white"/><text x="64" y="175" font-family="Microsoft YaHei, sans-serif" font-size="23" font-weight="700" fill="#171B1E">作废结算单</text><rect x="745" y="130" width="655" height="390" rx="12" fill="white"/><text x="769" y="175" font-family="Microsoft YaHei, sans-serif" font-size="23" font-weight="700" fill="#171B1E">结算前整笔作废</text><rect x="40" y="570" width="655" height="390" rx="12" fill="white"/><text x="64" y="615" font-family="Microsoft YaHei, sans-serif" font-size="23" font-weight="700" fill="#171B1E">设置成员角色</text><rect x="745" y="570" width="655" height="390" rx="12" fill="white"/><text x="769" y="615" font-family="Microsoft YaHei, sans-serif" font-size="23" font-weight="700" fill="#171B1E">退出账本</text><text x="64" y="223" font-family="Microsoft YaHei, sans-serif" font-size="17" font-weight="400" fill="#171B1E">S-202610-01  /  2026 年 10 月</text><text x="64" y="265" font-family="Microsoft YaHei, sans-serif" font-size="15" font-weight="400" fill="#68747B">旧单及快照保留，原账仍锁定，可重新结算。</text><text x="64" y="308" font-family="Microsoft YaHei, sans-serif" font-size="14" font-weight="400" fill="#68747B">作废原因（必填）</text><rect x="64" y="324" width="604" height="47" rx="7" fill="white" stroke="#DDE3E6"/><text x="78" y="352" font-family="Microsoft YaHei, sans-serif" font-size="15" font-weight="400" fill="#171B1E">说明结算单错误的原因</text><rect x="64" y="438" width="170" height="42" rx="5" fill="#00D2BE"/><text x="149.0" y="459.0" text-anchor="middle" dominant-baseline="central" font-family="Microsoft YaHei, sans-serif" font-size="15" font-weight="700" fill="#171B1E">确认作废</text><rect x="254" y="438" width="110" height="42" rx="5" fill="white" stroke="#DDE3E6"/><text x="309.0" y="459.0" text-anchor="middle" dominant-baseline="central" font-family="Microsoft YaHei, sans-serif" font-size="15" font-weight="700" fill="#007E78">取消</text><text x="769" y="223" font-family="Microsoft YaHei, sans-serif" font-size="17" font-weight="400" fill="#171B1E">日用品  /  E-1020  /  ¥ 300.00</text><text x="769" y="265" font-family="Microsoft YaHei, sans-serif" font-size="15" font-weight="400" fill="#68747B">仅适用于尚未结算的整笔无效记录。</text><text x="769" y="308" font-family="Microsoft YaHei, sans-serif" font-size="14" font-weight="400" fill="#68747B">作废原因（必填）</text><rect x="769" y="324" width="604" height="47" rx="7" fill="white" stroke="#DDE3E6"/><text x="783" y="352" font-family="Microsoft YaHei, sans-serif" font-size="15" font-weight="400" fill="#171B1E">请填写整笔无效的原因</text><rect x="769" y="438" width="170" height="42" rx="5" fill="#00D2BE"/><text x="854.0" y="459.0" text-anchor="middle" dominant-baseline="central" font-family="Microsoft YaHei, sans-serif" font-size="15" font-weight="700" fill="#171B1E">确认作废</text><rect x="959" y="438" width="110" height="42" rx="5" fill="white" stroke="#DDE3E6"/><text x="1014.0" y="459.0" text-anchor="middle" dominant-baseline="central" font-family="Microsoft YaHei, sans-serif" font-size="15" font-weight="700" fill="#007E78">取消</text><text x="64" y="664" font-family="Microsoft YaHei, sans-serif" font-size="17" font-weight="400" fill="#171B1E">成员：小林</text><text x="64" y="705" font-family="Microsoft YaHei, sans-serif" font-size="14" font-weight="400" fill="#68747B">账本角色</text><rect x="64" y="721" width="604" height="47" rx="7" fill="white" stroke="#DDE3E6"/><text x="78" y="749" font-family="Microsoft YaHei, sans-serif" font-size="15" font-weight="400" fill="#171B1E">管理员 / 普通记账成员 / 只读成员</text><text x="64" y="811" font-family="Microsoft YaHei, sans-serif" font-size="14" font-weight="400" fill="#68747B">默认管理员，可按需调整角色，保留至少一名。</text><text x="64" y="842" font-family="Microsoft YaHei, sans-serif" font-size="14" font-weight="400" fill="#68747B">不能撤销最后一名管理员，变更将记入日志。</text><rect x="64" y="882" width="170" height="42" rx="5" fill="#00D2BE"/><text x="149.0" y="903.0" text-anchor="middle" dominant-baseline="central" font-family="Microsoft YaHei, sans-serif" font-size="15" font-weight="700" fill="#171B1E">保存角色</text><rect x="254" y="882" width="110" height="42" rx="5" fill="white" stroke="#DDE3E6"/><text x="309.0" y="903.0" text-anchor="middle" dominant-baseline="central" font-family="Microsoft YaHei, sans-serif" font-size="15" font-weight="700" fill="#007E78">取消</text><text x="769" y="666" font-family="Microsoft YaHei, sans-serif" font-size="19" font-weight="400" fill="#171B1E">退出“呢喃小屋”？</text><text x="769" y="713" font-family="Microsoft YaHei, sans-serif" font-size="15" font-weight="400" fill="#68747B">退出后将无法访问账本，历史收支仍会保留。</text><text x="769" y="762" font-family="Microsoft YaHei, sans-serif" font-size="15" font-weight="400" fill="#68747B">若你是管理员，请先完成管理员转让。</text><rect x="769" y="794" width="604" height="53" rx="8" fill="#FFF4DC"/><text x="785" y="824" font-family="Microsoft YaHei, sans-serif" font-size="14" font-weight="400" fill="#A66E17">未结余额仍保留，后续处理按确认的业务规则执行。</text><rect x="769" y="882" width="170" height="42" rx="5" fill="#00D2BE"/><text x="854.0" y="903.0" text-anchor="middle" dominant-baseline="central" font-family="Microsoft YaHei, sans-serif" font-size="15" font-weight="700" fill="#171B1E">确认退出</text><rect x="959" y="882" width="110" height="42" rx="5" fill="white" stroke="#DDE3E6"/><text x="1014.0" y="903.0" text-anchor="middle" dominant-baseline="central" font-family="Microsoft YaHei, sans-serif" font-size="15" font-weight="700" fill="#007E78">留下</text></svg>